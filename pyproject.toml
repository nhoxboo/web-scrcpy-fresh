[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  ".venv",
  "static",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = [
  "E501",  # line-too-long; covered by formatter
  "B008",  # function call as default arg (Flask pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E402"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
