<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link href="/static/css/font-awesome.min.css" rel="stylesheet">
  <title>Web Scrcpy Panel</title>
  <script src="/static/js/socket.io.js"></script>
  <script src="/static/js/input.js"></script>
  <script src="/static/js/exp-golomb.js"></script>
  <script src="/static/js/h264-sps-parser.js"></script>
  <script src="/static/js/video_parser.js"></script>
  <style>
    :root{--bg:#070b16;--card:#0f172a;--line:#25324a;--txt:#e5e7eb;--muted:#94a3b8;--pri:#3b82f6;--ok:#22c55e}
    *{box-sizing:border-box}
    body{margin:0;height:100dvh;display:flex;flex-direction:column;background:radial-gradient(1100px 500px at 10% -10%,#1d4ed855,transparent),var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;overflow:hidden}
    .top{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);background:#0b1222d9;backdrop-filter:blur(4px);flex-wrap:wrap}
    .brand{font-weight:700}.sp{flex:1}.pill{font-size:.78rem;color:var(--muted)}
    .btn{border:1px solid var(--line);background:#162033;color:#dbeafe;border-radius:10px;padding:7px 10px;cursor:pointer;white-space:nowrap;text-decoration:none}
    .btn:hover{border-color:#60a5fa}
    .toolbar{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line);background:#0a1325;overflow-x:auto;touch-action:pan-x}
    .tool{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:#101b31;cursor:pointer;transition:.2s;flex:0 0 auto;color:#cbd5e1}
    .tool:hover{transform:translateY(-1px);border-color:#60a5fa;color:#93c5fd}
    .tool.active{border-color:#ef4444;color:#fecaca;background:#3a1120}
    .video-wrap{flex:1 1 auto;min-height:0;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;padding:10px;overflow:hidden;touch-action:none}
    .phone-shell{position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#1f2937,#111827);border:1px solid #4b5563;border-radius:34px;box-shadow:0 18px 40px #0009, inset 0 1px 0 #ffffff22;max-width:100%;max-height:100%;padding:18px 10px 14px 10px}
    .phone-shell::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:96px;height:18px;border-radius:12px;background:#0b1220;border:1px solid #334155}
    .phone-shell::after{content:'';position:absolute;top:14px;left:50%;transform:translateX(-50%);width:34px;height:5px;border-radius:6px;background:#1e293b}
    /* image-rendering: keep edges crisp on integer-scaled HiDPI screens.
       'auto' lets the browser bilinearly smooth at non-integer ratios so
       text doesn't look jagged when the video is shrunk to fit the viewport. */
    video{max-width:none;max-height:none;object-fit:contain;border-radius:20px;background:#000;touch-action:none;display:block;border:1px solid #1f2937;image-rendering:auto;image-rendering:-webkit-optimize-contrast}
    /* In fullscreen, let the video fill the screen instead of keeping the shrunk inline size. */
    video:fullscreen,video:-webkit-full-screen{width:100vw!important;height:100vh!important;max-width:100vw!important;max-height:100vh!important;border-radius:0;border:0;background:#000;object-fit:contain}
    .phone-shell:fullscreen,.phone-shell:-webkit-full-screen{width:100vw!important;height:100vh!important;padding:0;border:0;border-radius:0;background:#000}
    .phone-shell:fullscreen::before,.phone-shell:fullscreen::after,.phone-shell:-webkit-full-screen::before,.phone-shell:-webkit-full-screen::after{display:none}
    /* Landscape (post-rotation): drop the portrait-only notch + camera dot,
       and use a thinner symmetric frame so the shell looks like a phone in
       landscape orientation rather than a wide video stuffed into a portrait. */
    .phone-shell.landscape{padding:8px;border-radius:22px}
    .phone-shell.landscape::before,.phone-shell.landscape::after{display:none}
    /* DeX mode: drop the phone shell entirely. DeX is a desktop-style UI,
       and the rounded "phone" frame around it makes no sense. We also
       hide the notch/camera dot so the desktop fills the available area
       like a laptop would. */
    .phone-shell.dex{padding:0;border-radius:8px;border-color:#4b5563}
    .phone-shell.dex::before,.phone-shell.dex::after{display:none}
    /* When pointer lock is engaged for UHID mouse, give the user a clear
       hint that their mouse is captured (and how to release it). */
    .phone-shell.dex.locked{outline:2px solid #38bdf8}
    .resize-handle{position:absolute;right:8px;bottom:8px;width:18px;height:18px;border-radius:6px;background:#111827;border:1px solid #475569;cursor:nwse-resize;display:grid;place-items:center;color:#93c5fd;font-size:10px;user-select:none;z-index:3}
    .zoom-bar{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;z-index:6}
    .zoom-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#0f1b31cc;color:#dbeafe;cursor:pointer}
    .status{padding:4px 8px;border-top:1px solid var(--line);font-size:.78rem;color:#93c5fd;background:#0c1427;white-space:nowrap;overflow:auto}
    @media (max-width: 768px){.top{padding:6px 8px;gap:6px}.brand{font-size:.95rem}.pill{font-size:.72rem}.btn{padding:6px 8px;font-size:.78rem}.toolbar{padding:6px;gap:5px}.tool{width:34px;height:34px}.status{font-size:.74rem;padding:4px 6px}.phone-shell{border-radius:24px;padding:14px 8px 10px 8px}.phone-shell::before{top:6px;width:74px;height:14px}.phone-shell::after{top:10px;width:26px;height:4px}}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 1.2s infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
</head>
<body>
  <div class="top">
    <i class="fa-solid fa-mobile-screen-button"></i><div class="brand">Web Scrcpy</div>
    <span class="pill">user: {{ username }}</span>
    {% if device_label %}
      <span class="pill" title="Thiết bị đang điều khiển"><i class="fa-solid fa-mobile-screen"></i> {{ device_label }}</span>
    {% else %}
      <span class="pill" title="Chưa chọn thiết bị (đang dùng default)"><i class="fa-solid fa-mobile-screen"></i> auto</span>
    {% endif %}
    <a class="btn" href="/devices" title="Chọn thiết bị khác"><i class="fa-solid fa-shuffle"></i> Đổi máy</a>
    <div class="sp"></div>
    <a class="btn" href="/change-password"><i class="fa-solid fa-key"></i> Đổi mật khẩu</a>
    <form method="post" action="/logout" style="display:inline;margin:0">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <button class="btn" type="submit"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
    </form>
  </div>

  <div class="toolbar">
    <button class="tool" id="power" title="Power"><i class="fa-solid fa-power-off"></i></button>
    <button class="tool" id="voldown" title="Volume -"><i class="fa-solid fa-volume-low"></i></button>
    <button class="tool" id="volup" title="Volume +"><i class="fa-solid fa-volume-high"></i></button>
    <button class="tool" id="back" title="Back"><i class="fa-solid fa-arrow-left"></i></button>
    <button class="tool" id="home" title="Home"><i class="fa-solid fa-house"></i></button>
    <button class="tool" id="recent" title="Recent"><i class="fa-solid fa-layer-group"></i></button>
    <button class="tool" id="rotate" title="Rotate"><i class="fa-solid fa-rotate"></i></button>
    <button class="tool" id="fullscreen" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
    <button class="tool" id="dexMode" title="DeX Mode: OFF"><i class="fa-solid fa-display"></i></button>
    <button class="tool" id="uhidInput" title="Real mouse/keyboard (UHID): ON"><i class="fa-solid fa-mouse-pointer"></i></button>
    <button class="tool" id="reconnect" title="Kết nối lại"><i class="fa-solid fa-plug-circle-bolt"></i></button>
    <button class="tool" id="installApk" title="Cài APK (file hoặc URL)"><i class="fa-solid fa-cube"></i></button>
    <button class="tool" id="pushFile" title="Tải file vào /sdcard/Download"><i class="fa-solid fa-upload"></i></button>
    <button class="tool" id="kbToggle" title="Bật/tắt bàn phím (gõ chữ vào device)"><i class="fa-solid fa-i-cursor"></i></button>
    <button class="tool" id="macroRec" title="Bắt đầu ghi macro"><i class="fa-solid fa-record-vinyl"></i></button>
    <button class="tool" id="macroStop" title="Dừng ghi"><i class="fa-solid fa-stop"></i></button>
    <button class="tool" id="macroPlay" title="Chạy macro"><i class="fa-solid fa-play"></i></button>
    <button class="tool" id="macroClear" title="Xóa macro"><i class="fa-solid fa-trash"></i></button>
    <button class="tool" id="hotkeyConfig" title="Gán phím"><i class="fa-solid fa-keyboard"></i></button>
    <button class="tool" id="gameMode" title="Game mode: OFF"><i class="fa-solid fa-gamepad"></i></button>
  </div>

  <div class="video-wrap" id="videoWrap">
    <div class="phone-shell" id="phoneShell">
      <video id="player" autoplay muted webkit-playsinline playsinline x5-playsinline></video>
      <button class="resize-handle" id="resizeHandle" title="Kéo để đổi kích thước">◢</button>
    </div>
    <!--
      Off-screen capture surface for keyboard typing. Focusing this textarea
      routes physical / on-screen keyboard input into scrcpy via inject_text
      (for printable / IME-composed characters) and inject_keycode (for
      Enter, Backspace, arrows, etc). The textarea itself is invisible and
      its content is cleared after every emit so it never accumulates.
    -->
    <textarea id="kbCapture" autocomplete="off" autocorrect="off" autocapitalize="off"
              spellcheck="false" inputmode="text" aria-hidden="true"
              style="position:fixed;bottom:-50px;opacity:0;width:1px;height:1px;border:0;padding:0;outline:none;pointer-events:none"></textarea>
    <div class="zoom-bar">
      <button class="zoom-btn" id="zoomOut" title="Thu nhỏ"><i class="fa-solid fa-minus"></i></button>
      <button class="zoom-btn" id="zoomReset" title="Mặc định"><i class="fa-solid fa-arrows-rotate"></i></button>
      <button class="zoom-btn" id="zoomIn" title="Phóng to"><i class="fa-solid fa-plus"></i></button>
    </div>
  </div>

  <div id="status" class="status"><span class="dot"></span>Đang kết nối...</div>

  <script src="/static/js/jmuxer.min.js"></script>
  <script>
    const st = (m)=>document.getElementById('status').innerHTML = `<span class='dot'></span>${m}`;
    const MACRO_KEY = 'beso_macro_v1';
    const HOTKEY_KEY = 'beso_hotkeys_v1';
    const GAME_MODE_KEY = 'beso_game_mode_v1';
    const DEFAULT_HOTKEYS = {
      power:'KeyP', voldown:'Minus', volup:'Equal', back:'Backspace', home:'KeyH', recent:'KeyR', macroPlay:'KeyM',
      moveUp:'KeyW', moveLeft:'KeyA', moveDown:'KeyS', moveRight:'KeyD', jump:'Space', skill1:'KeyJ', skill2:'KeyK', skill3:'KeyL'
    };
    let hotkeys = {...DEFAULT_HOTKEYS};
    try{ hotkeys = {...DEFAULT_HOTKEYS, ...(JSON.parse(localStorage.getItem(HOTKEY_KEY)||'{}'))}; }catch{}

    const videoElement = document.getElementById('player');
    const videoWrap = document.getElementById('videoWrap');
    const phoneShell = document.getElementById('phoneShell');
    const resizeHandle = document.getElementById('resizeHandle');
    let deviceW = 0, deviceH = 0;
    let zoom = 0.82;
    let gameMode = localStorage.getItem(GAME_MODE_KEY) === '1';
    const heldKeys = new Set();
    let macroEvents = [];
    let isRecordingMacro = false;
    let isPlayingMacro = false;
    let macroStartAt = 0;
    try{ macroEvents = JSON.parse(localStorage.getItem(MACRO_KEY)||'[]'); }catch{ macroEvents = []; }

    function fitVideoToViewport() {
      if (!videoWrap || !videoElement || !phoneShell || !deviceW || !deviceH) return;
      // In fullscreen the CSS rule takes over (width/height 100vw/100vh). Don't
      // fight it with inline styles or the video will stay small.
      if (document.fullscreenElement || document.webkitFullscreenElement) return;
      const cw = videoWrap.clientWidth - 24;
      const ch = videoWrap.clientHeight - 24;
      if (!cw || !ch) return;

      const baseRatio = Math.min(cw / deviceW, ch / deviceH);
      const ratio = Math.max(0.22, Math.min(2.2, baseRatio * zoom));
      const w = Math.max(1, Math.floor(deviceW * ratio));
      const h = Math.max(1, Math.floor(deviceH * ratio));

      // object-fit:contain stretches the displayed frame to fit our explicit
      // width/height while preserving the stream's aspect ratio. Without this,
      // a stale buffered frame in a different aspect (right after a rotation)
      // can briefly distort the video before the new stream takes over.
      videoElement.style.objectFit = 'contain';
      videoElement.style.width = `${w}px`;
      videoElement.style.height = `${h}px`;
      const landscape = deviceW > deviceH;
      const shellExtraW = landscape ? 16 : 20; // tighter horizontal frame in landscape
      const shellExtraH = landscape ? 16 : 32; // hide notch space in landscape
      phoneShell.style.width = `${w + shellExtraW}px`;
      phoneShell.style.height = `${h + shellExtraH}px`;
      // Hide the (portrait-only) speaker / camera decorations when landscape so
      // the layout doesn't look like a portrait phone holding a wide video.
      phoneShell.classList.toggle('landscape', landscape);
    }

    // Refit also when the browser tells us the <video>'s intrinsic dimensions
    // changed (e.g. new SPS arrived after rotation). Without this, the video
    // can keep displaying inside an old-aspect box for ~1 frame after rotation.
    function scheduleRefit(){
      // RAF coalesces multiple events into a single layout pass.
      if (scheduleRefit._pending) return;
      scheduleRefit._pending = true;
      requestAnimationFrame(()=>{
        scheduleRefit._pending = false;
        fitVideoToViewport();
      });
    }

    function setZoom(nextZoom){
      zoom = Math.max(0.3, Math.min(2.0, nextZoom));
      fitVideoToViewport();
    }
    let jmuxer = null;
    function createJmuxer(){
      if (jmuxer){
        try{ jmuxer.destroy(); }catch(_e){}
        jmuxer = null;
      }
      // Aggressive MSE teardown: Safari keeps the old MediaSource attached and
      // refuses to accept SPS/PPS with a different resolution unless we fully
      // detach. pause() stops decoder threads; revoking the blob URL frees the
      // MediaSource; nullifying srcObject covers browsers that use that path;
      // load() resets the element's media engine. Then we drop the inline
      // width/height so a stale aspect doesn't briefly distort the next frame.
      try{ videoElement.pause(); }catch(_e){}
      try{
        const oldSrc = videoElement.getAttribute('src');
        if (oldSrc && oldSrc.startsWith('blob:')) URL.revokeObjectURL(oldSrc);
      }catch(_e){}
      try{ videoElement.removeAttribute('src'); }catch(_e){}
      try{ videoElement.srcObject = null; }catch(_e){}
      try{ videoElement.load(); }catch(_e){}
      // Clear inline size so the new frame's intrinsic ratio drives layout
      // until fitVideoToViewport runs again with the new deviceW/deviceH.
      videoElement.style.width = '';
      videoElement.style.height = '';
      jmuxer = new JMuxer({ node:'player', mode:'video', flushingTime:0, fps:60, clearBuffer:true,
        onError:(err)=>st('Decoder error: '+(err?.message||JSON.stringify(err)))
      });
    }
    createJmuxer();
    // The browser fires 'resize' on <video> when its intrinsic dimensions
    // change (e.g. new SPS after rotation). Refitting here makes the frame
    // settle into the right box without waiting for the user to resize the
    // window. 'loadedmetadata' covers the very first frame after recreation.
    videoElement.addEventListener('resize', scheduleRefit);
    videoElement.addEventListener('loadedmetadata', scheduleRefit);

    // DeX mode: send display_id=2 (typical Samsung DeX) to the server when on.
    // The server validates the value; can be overridden per-device by setting
    // localStorage.dexDisplayId to the right id from `adb shell dumpsys display`.
    const dexOn = localStorage.getItem('dexMode') === '1';
    const dexId = parseInt(localStorage.getItem('dexDisplayId') || '2', 10) || 2;
    // UHID input is independent of DeX. When ON the browser registers a
    // virtual HID mouse + keyboard on the device, giving a real cursor and
    // proper modifier keys regardless of whether DeX is active. Default is
    // ON because the experience is closer to a desktop remote-control tool;
    // user can flip it OFF via the toolbar to fall back to touch input
    // (useful for typing Vietnamese via the Android IME, which UHID
    // bypasses).
    const uhidOn = (localStorage.getItem('uhidInput') ?? '1') === '1';
    const socket = io({
      reconnection:true,
      autoConnect:true,
      query: dexOn ? { display_id: String(dexId) } : {},
    });
    socket.on('connect', ()=> st('Đã kết nối.'));
    socket.on('disconnect', (reason)=> st('Mất kết nối: '+reason));
    socket.on('connect_error', (err)=>{
      const msg = (err && (err.message || err.data)) || 'Không thể kết nối tới server.';
      // If DeX is on and the server says the display is unavailable, auto
      // turn DeX off so the user isn't stuck reload-looping. The server
      // returns Vietnamese "không khả dụng" when display_id != 0 fails.
      const dexCurrentlyOn = localStorage.getItem('dexMode') === '1';
      const looksLikeDexFail = /display.*không khả dụng|display.*not found|no display|invalid display/i.test(msg);
      if (dexCurrentlyOn && looksLikeDexFail) {
        localStorage.setItem('dexMode', '0');
        st('Máy này không hỗ trợ DeX. Đã tự tắt DeX, đang tải lại...');
        socket.disconnect();
        setTimeout(()=>location.reload(), 800);
        return;
      }
      st('Bị từ chối: '+msg);
    });
    let input = null;

    function initInput(width, height) {
      function sendControl(data){
        socket.emit('control_data', data);
        if (isRecordingMacro && !isPlayingMacro) {
          let payload = data;
          try { payload = JSON.parse(JSON.stringify(data)); } catch {}
          macroEvents.push({ t: Date.now() - macroStartAt, type:'control', payload });
        }
      }
      input = new ScrcpyInput(sendControl, videoElement, width, height, false, {
        // UHID gives a real USB-HID mouse + keyboard on the device side,
        // independent of DeX. Toggleable from the toolbar.
        useUhid: uhidOn,
      });
      if (uhidOn) {
        input.enableUhid();
        // Forward keyboard events at the document level — <video> elements
        // don't take keyboard focus by default. Only when the user has
        // pointer-locked the video do we hijack keys; otherwise normal
        // browser shortcuts (F5, Ctrl+T, ...) keep working.
        const uhidKeyDown = (ev) => {
          if (document.pointerLockElement !== videoElement) return;
          if (input && input._uhidKeyDown(ev)) ev.preventDefault();
        };
        const uhidKeyUp = (ev) => {
          if (document.pointerLockElement !== videoElement) return;
          if (input && input._uhidKeyUp(ev)) ev.preventDefault();
        };
        window.addEventListener('keydown', uhidKeyDown, true);
        window.addEventListener('keyup', uhidKeyUp, true);
        document.addEventListener('pointerlockchange', () => {
          const locked = document.pointerLockElement === videoElement;
          phoneShell.classList.toggle('locked', locked);
          if (locked) st('UHID: chuột đã khoá. Nhấn ESC để thoát.');
          else st('UHID: click vào màn hình để khoá chuột.');
        });
      }
      if (dexOn) {
        // DeX-specific cosmetics: drop the phone-shell decoration (notch,
        // camera dot, rounded portrait border) and hide the Rotate button
        // because DeX desktop doesn't rotate.
        phoneShell.classList.add('dex');
        const rotBtn = document.getElementById('rotate');
        if (rotBtn) rotBtn.style.display = 'none';
      }
      if (uhidOn || dexOn) {
        const hint = uhidOn
          ? 'Real mouse/keyboard (UHID). Click màn hình để khoá chuột, ESC để thoát.'
          : 'DeX mode';
        st(hint);
      }
      // Clipboard sync (always on while connected).
      // Browser → device: when the user copies in the browser, mirror to
      // the device clipboard via SET_CLIPBOARD. Catches both Ctrl+C and
      // programmatic copies. We use the document-level 'copy' event because
      // navigator.clipboard.read() requires a user gesture and a permission
      // grant we may not have.
      document.addEventListener('copy', () => {
        try {
          // Read the freshly-copied selection. setTimeout(0) yields so the
          // browser has actually populated the clipboard.
          setTimeout(async () => {
            try {
              const text = await navigator.clipboard.readText();
              if (text && input) input.sendSetClipboard(text, false);
            } catch { /* permission denied — fall back silently */ }
          }, 0);
        } catch { /* ignore */ }
      });
      // Device → browser: server pushes 'device_clipboard' whenever the
      // device clipboard changes (including initial state at connect).
      // Best-effort write into the browser clipboard; if the permission
      // isn't granted, surface the text in the status bar so the user can
      // grab it manually.
      let lastDeviceClip = null;
      socket.on('device_clipboard', async (payload) => {
        const text = (payload && payload.text) || '';
        if (!text || text === lastDeviceClip) return;
        lastDeviceClip = text;
        try {
          await navigator.clipboard.writeText(text);
          st('Đã đồng bộ clipboard từ thiết bị (' + text.length + ' ký tự).');
        } catch {
          // Browsers require focus + permission for writeText; show a tiny
          // hint so the user knows the value is available.
          const preview = text.slice(0, 60).replace(/\s+/g, ' ');
          st('Clipboard từ thiết bị: ' + preview + (text.length > 60 ? '…' : ''));
        }
      });

      const keyTap = (code, actionName='key')=>{
        if (isRecordingMacro) {
          macroEvents.push({ t: Date.now() - macroStartAt, type:'keyTap', code, actionName });
        }
        if(!input){ st('Input chưa sẵn sàng'); return; }
        const ev = {shiftKey:false,ctrlKey:false,altKey:false,metaKey:false,getModifierState:()=>false,repeat:0};
        input.sendKeyCode(ev,0,code); input.sendKeyCode(ev,1,code); st('Đã gửi keyevent '+code);
      };
      const keyDown = (code)=>{
        if(!input){ st('Input chưa sẵn sàng'); return; }
        const ev = {shiftKey:false,ctrlKey:false,altKey:false,metaKey:false,getModifierState:()=>false,repeat:0};
        input.sendKeyCode(ev,0,code);
      };
      const keyUp = (code)=>{
        if(!input){ return; }
        const ev = {shiftKey:false,ctrlKey:false,altKey:false,metaKey:false,getModifierState:()=>false,repeat:0};
        input.sendKeyCode(ev,1,code);
      };

      const doPower = ()=>{
        input.screen_on_off(0);
        setTimeout(()=>input.screen_on_off(1), 80);
        st('Đã gửi Power');
      };
      const doVolDown = ()=>keyTap(25,'voldown');
      const doVolUp = ()=>keyTap(24,'volup');
      const doBack = ()=>keyTap(4,'back');
      const doHome = ()=>keyTap(3,'home');
      const doRecent = ()=>keyTap(187,'recent');

      document.getElementById('power').onclick = ()=>{ if(isRecordingMacro) macroEvents.push({ t: Date.now()-macroStartAt, type:'power', actionName:'power' }); doPower(); };
      document.getElementById('voldown').onclick = doVolDown;
      document.getElementById('volup').onclick = doVolUp;
      document.getElementById('back').onclick = doBack;
      document.getElementById('home').onclick = doHome;
      document.getElementById('recent').onclick = doRecent;
      document.getElementById('rotate').onclick = ()=>{
        if(!input){ st('Input chưa sẵn sàng'); return; }
        input.rotateDevice();
        st('Đã gửi lệnh xoay màn hình');
      };

      // DeX mode toggle: stores preference and reloads so the socket reconnects
      // with the new display_id query param. Requires DeX to already be active
      // on the Samsung device (cable, dock, or wireless DeX).
      const dexBtn = document.getElementById('dexMode');
      const refreshDexBtn = ()=>{
        const on = localStorage.getItem('dexMode') === '1';
        dexBtn.classList.toggle('active', on);
        const idShown = parseInt(localStorage.getItem('dexDisplayId') || '2', 10) || 2;
        dexBtn.title = on ? `DeX Mode: ON (display_id=${idShown})` : 'DeX Mode: OFF';
      };
      refreshDexBtn();
      dexBtn.onclick = (e)=>{
        const cur = localStorage.getItem('dexMode') === '1';
        if (e.shiftKey) {
          const ans = prompt('Nhập display_id cho DeX (mặc định 2):', localStorage.getItem('dexDisplayId') || '2');
          if (ans === null) return;
          const n = parseInt(ans, 10);
          if (Number.isFinite(n) && n >= 0 && n < 100) {
            localStorage.setItem('dexDisplayId', String(n));
          }
        }
        localStorage.setItem('dexMode', cur ? '0' : '1');
        st(cur ? 'Tắt DeX, đang tải lại...' : 'Bật DeX, đang tải lại...');
        setTimeout(()=>location.reload(), 250);
      };

      // UHID toggle: independent of DeX. Reload so UHID_CREATE / control
      // listeners are wired (or unwired) cleanly — the alternative is to
      // hot-swap event listeners at runtime, which is fragile.
      const uhidBtn = document.getElementById('uhidInput');
      const refreshUhidBtn = ()=>{
        const on = (localStorage.getItem('uhidInput') ?? '1') === '1';
        uhidBtn.classList.toggle('active', on);
        uhidBtn.title = on
          ? 'Real mouse/keyboard (UHID): ON — click để tắt'
          : 'Real mouse/keyboard (UHID): OFF — touch + IME (gõ tiếng Việt)';
      };
      refreshUhidBtn();
      uhidBtn.onclick = ()=>{
        const cur = (localStorage.getItem('uhidInput') ?? '1') === '1';
        localStorage.setItem('uhidInput', cur ? '0' : '1');
        st(cur ? 'Tắt UHID, đang tải lại...' : 'Bật UHID, đang tải lại...');
        setTimeout(()=>location.reload(), 250);
      };
      // Manual reconnect: useful when the device is unplugged/replugged or
      // the network blip caused socket.io's auto-reconnect to give up. Also
      // tears down jmuxer / MSE so the new stream's SPS/PPS isn't fed into
      // a stale decoder (same fix as the rotate path).
      document.getElementById('reconnect').onclick = ()=>{
        st('Đang kết nối lại...');
        try { socket.disconnect(); } catch {}
        try { if (jmuxer) { jmuxer.destroy(); } } catch {}
        jmuxer = null;
        try {
          videoElement.pause();
          videoElement.removeAttribute('src');
          videoElement.srcObject = null;
          videoElement.load();
        } catch {}
        // Small delay so the server's disconnect handler runs (scrcpy_stop
        // releases the singleton) before we try to reconnect.
        setTimeout(()=>{
          try { socket.connect(); } catch (e) { st('Lỗi reconnect: '+e); }
        }, 300);
      };

      document.getElementById('zoomOut').onclick = ()=>setZoom(zoom - 0.12);
      document.getElementById('zoomIn').onclick = ()=>setZoom(zoom + 0.12);
      document.getElementById('zoomReset').onclick = ()=>setZoom(0.82);

      // --- APK install (file or URL) + file push ---------------------------
      const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
      // hidden file pickers; created once and reused
      const apkPicker = document.createElement('input');
      apkPicker.type = 'file'; apkPicker.accept = '.apk,application/vnd.android.package-archive';
      apkPicker.style.display = 'none';
      document.body.appendChild(apkPicker);
      const filePicker = document.createElement('input');
      filePicker.type = 'file';
      filePicker.style.display = 'none';
      document.body.appendChild(filePicker);

      async function postWithProgress(url, formData, onProgress){
        // XHR (instead of fetch) for upload progress events; fetch streams
        // are spotty across browsers especially on mobile Safari.
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('POST', url);
          xhr.setRequestHeader('X-CSRF-Token', csrfToken);
          xhr.upload.onprogress = (e) => {
            if (e.lengthComputable && onProgress) onProgress(e.loaded, e.total);
          };
          xhr.onload = () => {
            try { resolve({ status: xhr.status, body: JSON.parse(xhr.responseText) }); }
            catch (_e) { resolve({ status: xhr.status, body: { ok: false, error: xhr.responseText || 'Lỗi không rõ' } }); }
          };
          xhr.onerror = () => reject(new Error('Network error'));
          xhr.send(formData);
        });
      }

      document.getElementById('installApk').onclick = async () => {
        // Choice dialog: file vs URL. Using prompt() avoids a heavy modal.
        const url = prompt('Nhập URL APK để cài, hoặc bỏ trống và chọn file từ máy:', '');
        if (url === null) return;
        if (url.trim()) {
          st('Đang tải APK từ URL...');
          const fd = new FormData();
          fd.append('url', url.trim());
          fd.append('csrf_token', csrfToken);
          try {
            const { body } = await postWithProgress('/api/install', fd);
            st(body.ok ? 'Cài đặt APK thành công.' : ('Cài đặt thất bại: ' + (body.error || 'unknown')));
          } catch (e) {
            st('Cài đặt lỗi: ' + (e?.message || e));
          }
          return;
        }
        // No URL → open file picker
        apkPicker.value = '';
        apkPicker.click();
      };
      apkPicker.onchange = async () => {
        const file = apkPicker.files && apkPicker.files[0];
        if (!file) return;
        st(`Đang upload ${file.name}...`);
        const fd = new FormData();
        fd.append('file', file);
        try {
          const { body } = await postWithProgress('/api/install', fd, (l, t) => {
            const pct = t ? Math.round(l * 100 / t) : 0;
            st(`Upload ${file.name}: ${pct}%`);
          });
          st(body.ok ? 'Cài đặt APK thành công.' : ('Cài đặt thất bại: ' + (body.error || 'unknown')));
        } catch (e) {
          st('Cài đặt lỗi: ' + (e?.message || e));
        }
      };

      document.getElementById('pushFile').onclick = () => {
        filePicker.value = '';
        filePicker.click();
      };
      filePicker.onchange = async () => {
        const file = filePicker.files && filePicker.files[0];
        if (!file) return;
        st(`Đang upload ${file.name} -> /sdcard/Download/`);
        const fd = new FormData();
        fd.append('file', file);
        try {
          const { body } = await postWithProgress('/api/push', fd, (l, t) => {
            const pct = t ? Math.round(l * 100 / t) : 0;
            st(`Upload ${file.name}: ${pct}%`);
          });
          st(body.ok ? `Đã lưu vào ${body.dest}` : ('Upload thất bại: ' + (body.error || 'unknown')));
        } catch (e) {
          st('Upload lỗi: ' + (e?.message || e));
        }
      };

      // --- Keyboard typing (inject_text + inject_keycode) -------------------
      // Toggle: focuses a hidden <textarea> so the OS / mobile keyboard pops up
      // and we can capture both regular characters (via 'input' / IME
      // 'compositionend' for Vietnamese) and special keys (Enter, Backspace,
      // arrows, ... via 'keydown').
      const kbBtn = document.getElementById('kbToggle');
      const kbCapture = document.getElementById('kbCapture');
      let kbActive = false;
      // Special keys → Android keycodes (subset that doesn't have a printable
      // character to feed inject_text). Mapped from KeyboardEvent.key for
      // robustness across layouts and IMEs.
      const SPECIAL_KEYS = {
        'Enter': 66, 'NumpadEnter': 66,
        'Backspace': 67,
        'Tab': 61,
        'Escape': 111,
        'ArrowLeft': 21, 'ArrowRight': 22, 'ArrowUp': 19, 'ArrowDown': 20,
        'Home': 122, 'End': 123, 'PageUp': 92, 'PageDown': 93,
        'Delete': 112,
      };
      function setKeyboard(on) {
        kbActive = on;
        if (on) {
          kbBtn.classList.add('active');
          kbBtn.title = 'Bàn phím: BẬT — gõ chữ vào device (click ra ngoài để tắt)';
          kbCapture.style.pointerEvents = 'auto';
          kbCapture.value = '';
          // setTimeout to make iOS Safari actually pop the keyboard up.
          setTimeout(() => kbCapture.focus(), 0);
          st('Bàn phím: BẬT');
        } else {
          kbBtn.classList.remove('active');
          kbBtn.title = 'Bật/tắt bàn phím (gõ chữ vào device)';
          kbCapture.style.pointerEvents = 'none';
          kbCapture.blur();
          st('Bàn phím: TẮT');
        }
      }
      kbBtn.onclick = () => setKeyboard(!kbActive);
      kbCapture.addEventListener('blur', () => {
        // If the textarea loses focus (user clicked elsewhere), turn the
        // mode off so the icon state matches reality.
        if (kbActive) setKeyboard(false);
      });

      // IME composition (e.g. Telex / Unikey for Vietnamese). We wait until
      // 'compositionend' before sending so the diacritic has settled into a
      // single code point (e.g. "a" then "?" -> "ả" sent once).
      let composing = false;
      kbCapture.addEventListener('compositionstart', () => { composing = true; });
      kbCapture.addEventListener('compositionend', (e) => {
        composing = false;
        if (!input || !e.data) { kbCapture.value = ''; return; }
        input.sendInjectText(e.data);
        kbCapture.value = '';
      });

      // 'input' fires on every printable insertion that ISN'T part of an
      // active IME composition. This is the path most physical keyboard
      // strokes go through, plus mobile keyboard taps.
      kbCapture.addEventListener('input', (e) => {
        if (composing) return;
        if (!input) { kbCapture.value = ''; return; }
        // For 'insertText' we have e.data; for paste it's null and the value
        // contains the inserted text. Either way, drain whatever is in the
        // textarea and send it as one batch.
        const text = e.data != null ? e.data : kbCapture.value;
        if (text) input.sendInjectText(text);
        kbCapture.value = '';
      });

      // keydown handles non-printable / control keys, which never trigger
      // 'input'. Fires before 'input', so we preventDefault on the textarea
      // so Backspace doesn't try to delete from an already-empty box.
      kbCapture.addEventListener('keydown', (e) => {
        if (composing) return;
        const code = SPECIAL_KEYS[e.key];
        if (code !== undefined && input) {
          input.sendKeyCode(e, 0, code);
          input.sendKeyCode(e, 1, code);
          e.preventDefault();
        }
      });

      const recBtn = document.getElementById('macroRec');
      const stopBtn = document.getElementById('macroStop');
      const playBtn = document.getElementById('macroPlay');
      const clearBtn = document.getElementById('macroClear');
      const hotkeyBtn = document.getElementById('hotkeyConfig');
      const gameBtn = document.getElementById('gameMode');

      recBtn.onclick = ()=>{
        macroEvents = [];
        isRecordingMacro = true;
        macroStartAt = Date.now();
        recBtn.classList.add('active');
        localStorage.setItem(MACRO_KEY, JSON.stringify(macroEvents));
        st('Bắt đầu ghi macro...');
      };
      stopBtn.onclick = ()=>{
        isRecordingMacro = false;
        recBtn.classList.remove('active');
        localStorage.setItem(MACRO_KEY, JSON.stringify(macroEvents));
        st(`Đã dừng ghi macro (${macroEvents.length} bước)`);
      };
      clearBtn.onclick = ()=>{
        macroEvents = [];
        localStorage.setItem(MACRO_KEY, '[]');
        st('Đã xóa macro');
      };
      playBtn.onclick = async ()=>{
        const events = Array.isArray(macroEvents) ? [...macroEvents] : [];
        if(!events.length){ st('Chưa có macro để chạy'); return; }
        isRecordingMacro = false;
        recBtn.classList.remove('active');
        isPlayingMacro = true;
        st(`Đang chạy macro (${events.length} bước)...`);
        const startAt = Date.now();
        for(const ev of events){
          const wait = Math.max(0, ev.t - (Date.now() - startAt));
          if(wait) await new Promise(r=>setTimeout(r, wait));
          if(ev.type==='power') doPower();
          if(ev.type==='keyTap') keyTap(ev.code, ev.actionName || 'key');
          if(ev.type==='control' && ev.payload){ socket.emit('control_data', ev.payload); }
        }
        isPlayingMacro = false;
        st('Chạy macro xong');
      };

      const syncGameButton = ()=>{
        gameBtn.classList.toggle('active', gameMode);
        gameBtn.title = `Game mode: ${gameMode ? 'ON' : 'OFF'}`;
      };
      syncGameButton();
      gameBtn.onclick = ()=>{
        gameMode = !gameMode;
        localStorage.setItem(GAME_MODE_KEY, gameMode ? '1' : '0');
        if(!gameMode){
          // Release held movement keys when turning game mode off
          [19,20,21,22].forEach(code=>keyUp(code));
          heldKeys.clear();
        }
        syncGameButton();
        st(`Game mode: ${gameMode ? 'ON' : 'OFF'}`);
      };

      hotkeyBtn.onclick = ()=>{
        const tips = `Gán phím (code KeyboardEvent):\n`+
          `Power (${hotkeys.power})\nVol- (${hotkeys.voldown})\nVol+ (${hotkeys.volup})\nBack (${hotkeys.back})\nHome (${hotkeys.home})\nRecent (${hotkeys.recent})\nPlay Macro (${hotkeys.macroPlay})\n\nNhập JSON mới hoặc Cancel để bỏ qua.`;
        const raw = prompt(tips, JSON.stringify(hotkeys, null, 2));
        if(!raw) return;
        try{
          const next = JSON.parse(raw);
          hotkeys = {...hotkeys, ...next};
          localStorage.setItem(HOTKEY_KEY, JSON.stringify(hotkeys));
          st('Đã lưu gán phím');
        }catch{
          st('JSON không hợp lệ, chưa lưu');
        }
      };

      window.addEventListener('keydown', (e)=>{
        if(['INPUT','TEXTAREA'].includes((e.target?.tagName||'').toUpperCase())) return;

        const holdMap = {
          [hotkeys.moveUp]: 19,    // DPAD_UP
          [hotkeys.moveDown]: 20,  // DPAD_DOWN
          [hotkeys.moveLeft]: 21,  // DPAD_LEFT
          [hotkeys.moveRight]: 22, // DPAD_RIGHT
        };
        const tapMap = {
          [hotkeys.power]: ()=>{ if(isRecordingMacro) macroEvents.push({ t: Date.now()-macroStartAt, type:'power', actionName:'power' }); doPower(); },
          [hotkeys.voldown]: doVolDown,
          [hotkeys.volup]: doVolUp,
          [hotkeys.back]: doBack,
          [hotkeys.home]: doHome,
          [hotkeys.recent]: doRecent,
          [hotkeys.macroPlay]: ()=>playBtn.click(),
          [hotkeys.jump]: ()=>keyTap(62, 'jump'),
          [hotkeys.skill1]: ()=>keyTap(29, 'skill1'), // A
          [hotkeys.skill2]: ()=>keyTap(30, 'skill2'), // B
          [hotkeys.skill3]: ()=>keyTap(31, 'skill3'), // C
        };

        if(gameMode && holdMap[e.code]){
          e.preventDefault();
          if(heldKeys.has(e.code)) return;
          heldKeys.add(e.code);
          keyDown(holdMap[e.code]);
          return;
        }

        const fn = tapMap[e.code];
        if(fn){ e.preventDefault(); fn(); }
      });

      window.addEventListener('keyup', (e)=>{
        if(!gameMode) return;
        const holdMap = {
          [hotkeys.moveUp]: 19,
          [hotkeys.moveDown]: 20,
          [hotkeys.moveLeft]: 21,
          [hotkeys.moveRight]: 22,
        };
        if(holdMap[e.code]){
          e.preventDefault();
          heldKeys.delete(e.code);
          keyUp(holdMap[e.code]);
        }
      });

      let draggingResize = false;
      let dragStartY = 0;
      let startZoom = 1;
      const startResize = (clientY)=>{ draggingResize=true; dragStartY=clientY; startZoom=zoom; };
      const moveResize = (clientY)=>{ if(!draggingResize) return; const dy = dragStartY - clientY; setZoom(startZoom + (dy / 260)); };
      const endResize = ()=>{ draggingResize=false; };

      resizeHandle.addEventListener('mousedown', (e)=>{ startResize(e.clientY); e.preventDefault(); });
      window.addEventListener('mousemove', (e)=>moveResize(e.clientY));
      window.addEventListener('mouseup', endResize);
      resizeHandle.addEventListener('touchstart', (e)=>{ if(e.touches?.[0]) startResize(e.touches[0].clientY); e.preventDefault(); }, {passive:false});
      window.addEventListener('touchmove', (e)=>{ if(e.touches?.[0]) moveResize(e.touches[0].clientY); }, {passive:true});
      window.addEventListener('touchend', endResize, {passive:true});

      document.getElementById('fullscreen').onclick = async ()=>{
        try{
          if (!document.fullscreenElement) {
            if (videoElement.requestFullscreen) await videoElement.requestFullscreen();
            else if (videoElement.webkitRequestFullscreen) videoElement.webkitRequestFullscreen();
            st('Đã bật fullscreen');
          } else {
            if (document.exitFullscreen) await document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
            st('Đã tắt fullscreen');
          }
        }catch(e){
          st('Fullscreen lỗi: '+(e?.message||'unknown'));
        }
      };
    }

    const parser = new VideoParser(({ type, data }) => {
      if (type === 'nalu') {
        jmuxer.feed({ video: data });
      } else if (type === 'init') {
        jmuxer.feed({ video: data['sps'] });
        jmuxer.feed({ video: data['pps'] });
      } else if (type === 'screen_size') {
        deviceW = data['width'];
        deviceH = data['height'];
        initInput(deviceW, deviceH);
        fitVideoToViewport();
        st(`Kết nối OK | Screen ${deviceW}x${deviceH}`);
      } else if (type === 'size_change') {
        const newW = data['width'], newH = data['height'];
        // Resolution actually changed (rotation, DeX switch, fold/unfold) →
        // throw away the old MSE decoder; the upcoming 'init' event will feed
        // fresh SPS/PPS into the new instance.
        const aspectFlipped =
          deviceW && deviceH && (newW !== deviceW || newH !== deviceH);
        // Escape hatch: some browsers (notably older Safari builds) refuse to
        // accept a new SPS via MSE no matter how aggressively we tear down the
        // SourceBuffer. Set localStorage.reloadOnRotate='1' to fall back to a
        // hard page reload on resolution change — slower but always works.
        if (aspectFlipped && localStorage.getItem('reloadOnRotate') === '1') {
          st('Đổi kích thước: tải lại trang để khởi tạo lại decoder...');
          setTimeout(()=>location.reload(), 200);
          return;
        }
        if (aspectFlipped){
          createJmuxer();
          // After a portrait↔landscape flip, the previous zoom level is rarely
          // a good fit for the new aspect (the device looks tiny in the wrong
          // dimension). Snap back to the default so the user immediately sees
          // a sensibly framed phone shell.
          const wasPortrait = deviceH > deviceW;
          const isPortrait = newH > newW;
          if (wasPortrait !== isPortrait) zoom = 0.82;
        }
        deviceW = newW;
        deviceH = newH;
        if (input) input.resizeScreen(deviceW, deviceH);
        // RAF refit — fitVideoToViewport reads videoWrap.clientWidth which can
        // still reflect the old phone-shell footprint until the browser does
        // the next layout pass.
        scheduleRefit();
        st(`Đổi kích thước: ${deviceW}x${deviceH}`);
      }
    });

    socket.on('video_data', (data)=>{ parser.appendData(new Uint8Array(data)); });
    socket.on('connect', ()=>st('WS connected, đang nhận video...'));
    socket.on('disconnect', ()=>st('WS disconnected, đang thử reconnect...'));
    socket.on('connect_error', (e)=>st('WS lỗi: '+(e?.message||'unknown')));
    window.addEventListener('resize', fitVideoToViewport);
    document.addEventListener('fullscreenchange', fitVideoToViewport);
    window.addEventListener('beforeunload', ()=>socket.disconnect());
  </script>
</body>
</html>
