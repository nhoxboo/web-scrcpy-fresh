<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remote Android nhoxboo — Đăng nhập</title>
  <link href="/static/css/font-awesome.min.css?v={{ static_ver }}" rel="stylesheet">
  <link href="/static/css/app-shell.css?v={{ static_ver }}" rel="stylesheet">
  <link href="/static/css/ios-console.css?v={{ static_ver }}" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="auth-card ui-card" aria-labelledby="page-title">
    <p class="eyebrow">REMOTE ANDROID</p>
    <h1 id="page-title">Đăng nhập</h1>
    <p class="helper-text">Đăng nhập để điều khiển thiết bị Android từ trình duyệt.</p>

    <form class="form-stack" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="ui-label" for="username">
        Tên đăng nhập
        <input id="username" class="ui-input" name="username" placeholder="username" autocomplete="username" required autofocus>
      </label>
      <label class="ui-label" for="password">
        Mật khẩu
        <input id="password" class="ui-input" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </label>
      <button class="button-primary" type="submit">
        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i> Đăng nhập
      </button>
    </form>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <p class="status-banner" role="alert"><i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i> {{ messages[-1] }}</p>
      {% endif %}
    {% endwith %}
  </main>
</body>
</html>
