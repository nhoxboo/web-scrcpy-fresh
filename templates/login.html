<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập - Web Scrcpy</title>
  <link href="/static/css/font-awesome.min.css" rel="stylesheet">
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(135deg,#0f172a,#1e293b,#0b1020); font-family:system-ui,sans-serif; color:#e5e7eb; }
    .card { width:min(92vw,380px); background:rgba(17,24,39,.85); border:1px solid #334155; border-radius:16px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
    h1{margin:0 0 12px;font-size:1.1rem;display:flex;align-items:center;gap:8px}
    .field{margin-top:10px}
    input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#e5e7eb}
    button{margin-top:14px;width:100%;padding:10px;border-radius:10px;border:none;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
    .flash{margin-top:10px;color:#fca5a5;font-size:.9rem}
  </style>
</head>
<body>
  <form class="card" method="post">
    <h1><i class="fa-solid fa-shield-halved"></i> Đăng nhập Web Scrcpy</h1>
    <div class="field"><input name="username" placeholder="Username" required></div>
    <div class="field"><input type="password" name="password" placeholder="Password" required></div>
    <button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập</button>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">{{ messages[-1] }}</div>
      {% endif %}
    {% endwith %}
  </form>
</body>
</html>
