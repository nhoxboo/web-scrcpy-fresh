<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đổi mật khẩu</title>
  <link href="/static/css/font-awesome.min.css" rel="stylesheet">
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:#0b1020; font-family:system-ui,sans-serif; color:#e5e7eb; }
    .card { width:min(92vw,430px); background:#111827; border:1px solid #334155; border-radius:16px; padding:20px; }
    .field{margin-top:10px}
    input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #334155;background:#0b1220;color:#e5e7eb}
    button,a{margin-top:14px;display:inline-block;padding:10px 14px;border-radius:10px;border:none;text-decoration:none}
    .btn{background:#2563eb;color:#fff}
    .back{background:#1f2937;color:#d1d5db}
    .flash{margin-top:10px;color:#93c5fd;font-size:.9rem}
  </style>
</head>
<body>
  <form class="card" method="post">
    <h2><i class="fa-solid fa-key"></i> Đổi tài khoản / mật khẩu</h2>
    <div class="field"><input name="new_username" value="{{ username }}" required></div>
    <div class="field"><input type="password" name="current_password" placeholder="Mật khẩu hiện tại" required></div>
    <div class="field"><input type="password" name="new_password" placeholder="Mật khẩu mới" required></div>
    <div class="field"><input type="password" name="confirm_password" placeholder="Xác nhận mật khẩu mới" required></div>
    <button class="btn" type="submit">Lưu thay đổi</button>
    <a class="back" href="/">Quay lại</a>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="flash">{{ messages[-1] }}</div>{% endif %}
    {% endwith %}
  </form>
</body>
</html>
