<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remote Android nhoxboo — Đổi mật khẩu</title>
  <link href="/static/css/font-awesome.min.css" rel="stylesheet">
  <link href="/static/css/glass.css" rel="stylesheet">
  <style>
    body { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    .card { width: min(94vw, 460px); padding: 28px 26px; display: flex; flex-direction: column; gap: 14px; }
    .card h2 { margin: 0 0 4px; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; font-weight: 600; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: .78rem; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    .actions { display: flex; gap: 10px; margin-top: 6px; }
    .actions .glass-btn { flex: 1; }
    .flash { margin-top: 6px; padding: 10px 12px; border-radius: var(--radius-sm); background: rgba(106, 166, 255, 0.10); border: 1px solid rgba(106, 166, 255, 0.30); color: #c7d2fe; font-size: .9rem; }
    .brand-row { display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--muted); margin-bottom: 4px; }
    .brand-row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-3); box-shadow: 0 0 12px var(--accent-3); }
  </style>
</head>
<body>
  <form class="glass card" method="post">
    <div class="brand-row"><span class="dot"></span><span class="brand-grad">Remote Android nhoxboo</span></div>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h2><i class="fa-solid fa-key"></i> Đổi tài khoản / mật khẩu</h2>
    <div class="field">
      <label>Tên đăng nhập</label>
      <input class="glass-input" name="new_username" value="{{ username }}" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Mật khẩu hiện tại</label>
      <input class="glass-input" type="password" name="current_password" placeholder="••••••••" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label>Mật khẩu mới</label>
      <input class="glass-input" type="password" name="new_password" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" required>
    </div>
    <div class="field">
      <label>Xác nhận mật khẩu mới</label>
      <input class="glass-input" type="password" name="confirm_password" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" required>
    </div>
    <div class="actions">
      <button class="glass-btn primary" type="submit"><i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi</button>
      <a class="glass-btn" href="/"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
    </div>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="flash"><i class="fa-solid fa-circle-info"></i> {{ messages[-1] }}</div>{% endif %}
    {% endwith %}
  </form>
</body>
</html>
