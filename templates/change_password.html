<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remote Android nhoxboo — Đổi mật khẩu</title>
  <link href="/static/css/font-awesome.min.css?v={{ static_ver }}" rel="stylesheet">
  <link href="/static/css/app-shell.css?v={{ static_ver }}" rel="stylesheet">
</head>
<body class="auth-page">
  <main class="auth-card ui-card" aria-labelledby="page-title">
    <p class="eyebrow">REMOTE ANDROID</p>
    <h1 id="page-title">Đổi tài khoản / mật khẩu</h1>
    <p class="helper-text">Cập nhật thông tin đăng nhập cho phiên làm việc này.</p>

    <form class="form-stack" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="ui-label" for="new-username">
        Tên đăng nhập
        <input id="new-username" class="ui-input" name="new_username" value="{{ username }}" autocomplete="username" required>
      </label>
      <label class="ui-label" for="current-password">
        Mật khẩu hiện tại
        <input id="current-password" class="ui-input" type="password" name="current_password" placeholder="••••••••" autocomplete="current-password" required>
      </label>
      <label class="ui-label" for="new-password">
        Mật khẩu mới
        <input id="new-password" class="ui-input" type="password" name="new_password" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" required>
      </label>
      <label class="ui-label" for="confirm-password">
        Xác nhận mật khẩu mới
        <input id="confirm-password" class="ui-input" type="password" name="confirm_password" placeholder="Nhập lại mật khẩu mới" autocomplete="new-password" required>
      </label>
      <button class="button-primary" type="submit"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Lưu thay đổi</button>
      <a class="button-secondary" href="/"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Quay lại</a>
    </form>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <p class="status-banner" role="status"><i class="fa-solid fa-circle-info" aria-hidden="true"></i> {{ messages[-1] }}</p>
      {% endif %}
    {% endwith %}
  </main>
</body>
</html>
